name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Compile and package
        run: mvn -B -q package

      - name: Smoke-test a demo
        run: mvn -B -q -Pparallel-fetch package exec:exec
